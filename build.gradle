plugins {
    id 'org.springframework.boot' version '3.5.6' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'tr.com.agesa.appinsight'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    // java-library: modüller arası api/implementation ayrımı için gerekli
    // (client modülleri DTO'larını bağımlı projelere api olarak açar).
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'

    java {
        // Kurumsal hedef: Java 21. Makinedeki varsayılan JDK ne olursa olsun
        // Gradle bu sürümü kullanır (foojay resolver gerekirse indirir).
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:3.5.6"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.0.0"
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        // Gradle 8.x + JUnit 5.11+ launcher'ı otomatik eklemiyor; olmadan
        // test executor hiç test çalıştırmadan hata veriyor.
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-parameters'
    }
}
