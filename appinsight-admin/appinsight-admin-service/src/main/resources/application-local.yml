# Yerel geliştirme — mevcut Node platformunun docker-compose'u ile AYNI veritabanı.
# Node backend'i kapatmaya gerek yok; iki sistem aynı DB üzerinde paralel çalışabilir
# (yol haritası §6.2 — strangler-fig / paralel çalıştırma).
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/insight_platform
    username: insight
    password: password
    hikari:
      maximum-pool-size: 5
      pool-name: appinsight-admin-pool

  data:
    redis:
      host: localhost
      port: 6379

# TimescaleDB — ayrı havuz. Node'daki TIMESCALE_URL ile aynı hedef (aynı DB, ayrı pool).
appinsight:
  timescale:
    jdbc-url: jdbc:postgresql://localhost:5432/insight_platform
    username: insight
    password: password
    maximum-pool-size: 10
    connection-timeout: 5000
    idle-timeout: 30000
    pool-name: appinsight-timescale-pool
    # Zaman damgaları SQL içinde ::text ile render ediliyor; render oturum saat dilimini
    # kullanır. PgJDBC bağlanırken oturumu JVM'in saat dilimine ayarlar (+03) — Node ise
    # sunucu varsayılanı UTC ile çalışıyor. Parite için UTC'ye sabitleniyor.
    connection-init-sql: SET TIME ZONE 'UTC'

# Node 3000'de duruyor; çakışmamak için Java 8080'de.
server:
  port: 8080

logging:
  level:
    tr.com.agesa.appinsight: DEBUG
    org.hibernate.SQL: DEBUG
