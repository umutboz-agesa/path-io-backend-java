spring:
  application:
    name: appinsight-admin

  jpa:
    # ŞEMAYA DOKUNULMAZ — tablolar Drizzle migration'ları ile yönetilir.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    # Node JSON.stringify tanımsız alanları atlar; biz de null alan yazmıyoruz.
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# Diğer mini-service'lerin bu servise Feign ile erişeceği adres.
appinsight:
  admin:
    url: ${APPINSIGHT_ADMIN_URL:http://localhost:8080}

logging:
  level:
    tr.com.agesa.appinsight: INFO
